version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: bundler
    directory: /hotcell
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: docker
    directories:
    - /
    - /hotcell
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
